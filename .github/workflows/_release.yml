name: release
on:
  workflow_call:
    inputs:
      major:
        required: true
        type: number
      minor:
        required: true
        type: number
      projectName:
        required: true
        type: string
      contentType:
        required: true
        type: string


jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: executables
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.major }}.${{ inputs.minor }}.${{ github.run_id }}
          name: Release ${{ inputs.major }}.${{ inputs.minor }}.${{ github.run_id }}
          files: |
            ${{ inputs.projectName }}
