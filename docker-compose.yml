    - TELEMETRY_DATA_LOG_LEVEL=${TELEMETRY_DATA_SERVICE_LOG_LEVEL}
    - TELEMETRY_DATA_JWT_SECRET=${AUTH_JWT_SECRET}
    - TELEMETRY_DATA_DB_SSL_MODE=${DEV_DB_SSL_MODE}
    - TELEMETRY_DATA_CACHE_HOST=${REDIS_HOSTS}
