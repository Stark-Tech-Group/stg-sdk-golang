x-kafka: &kafka
  image: confluentinc/cp-kafka:${KAFKA_VERSION}
  hostname: ${KAFKA_BOOTSTRAP_SERVER}
  container_name: kafka
  networks:
    - kafka
  ports:
    - '${KAFKA_PORT}:9092'
    - '29092:29092'
  environment:
    - KAFKA_BROKER_ID=1
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    - KAFKA_ADVERTISED_HOST_NAME=${KAFKA_BOOTSTRAP_SERVER}
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_BOOTSTRAP_SERVER}:${KAFKA_PORT},PLAINTEXT_HOST://localhost:29092
    - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    - KAFKA_NUM_PARTITIONS=3
    - KAFKA_DEFAULT_REPLICATIOLN_FACTOR=1

  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=kafka:9092"]
    interval: 30s
    timeout: 10s
    retries: 5
  depends_on:
    - zookeeper


