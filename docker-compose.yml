
x-nyiso: &nyiso
  image: ${REGISTRY}/${NYISO_IMAGE}
  build:
    context: .
    dockerfile: docker/nyiso.Dockerfile
  container_name: nyiso-data-pump
  ports:
    - "${NYISO_PORT}:${NYISO_PORT}"
  environment:
    - NYISO_KAFKA_USERNAME=${KAFKA_USERNAME}
    - NYISO_KAFKA_PRODUCER_PASSWORD=${KAFKA_PRODUCER_PASSWORD}
    - NYISO_KAFKA_PRODUCER_BOOTSTRAP_SERVER=${KAFKA_BOOTSTRAP_SERVER}
    - NYISO_PORT=${NYISO_PORT}
    - LOG_LEVEL=${NYISO_LOG_LEVEL}
    - NYISO_KAFKA_PRODUCER_GROUP_ID=${TELEMETRY_BUS_GROUP_ID}
    - NYISO_KAFKA_PRODUCER_TOPIC=${KAFKA_TELEMETRY_TOPIC}
    - NYISO_KAFKA_SASL_MECHANISM=${KAFKA_PRODUCER_SASL}
    - NYISO_KAFKA_SEC_PROTOCOL=${KAFKA_SEC_PROTOCOL}
  networks:
    - kafka
  depends_on:
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f","http://localhost:${NYISO_PORT}/status"]
    interval: 20s
    timeout: 5s
    retries: 5
    start_period: 60s


x-telemetry-data-service: &telemetry-data-service
  build:
    context: .
    dockerfile: docker/telemetry-data.Dockerfile
  image: ${REGISTRY}/${TELEMETRY_DATA_SERVICE_IMAGE}
  container_name: telemetry-data-service
  depends_on:
    migrations:
      condition: service_completed_successfully
    redis-cluster:
      condition: service_completed_successfully
    redis-node-1:
      condition: service_healthy
    redis-node-2:
      condition: service_healthy
    auth-service:
      condition: service_started
    search-service:
      condition: service_healthy
  networks:
    - backend
    - redisnet
  environment:
    - TELEMETRY_DATA_SERVICE_PORT=${TELEMETRY_DATA_SERVICE_PORT}
    - TELEMETRY_DATA_DB_HOST=${DEV_DB_PLAIN_HOST}
    - TELEMETRY_DATA_DB_PORT=${DEV_DB_PORT}
