x-ksqldb-cli: &ksqldb-cli
  image: confluentinc/cp-ksqldb-cli:${KAFKA_VERSION}
  container_name: ksqldb-cli
  depends_on:
    - kafka
    - ksqldb
  entrypoint: /bin/sh
  tty: true
  networks:
    - kafka
  environment:
    KSQL_CONFIG_DIR: "/etc/ksql"
  volumes:
    - ./src:/opt/app/src

